<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3A1E12">
<title>لوحة المنيو | بوكا</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --choc:#3A1E12; --choc-2:#4B2A1B; --cream:#F6F1E9; --cream-2:#EBE3D6; --paper:#FFFDF9; --ink:#2A160D;
  --accent:#C08B5C; --accent-2:#E3C5A5; --accent-deep:#8A5A33; --muted:#6F5444;
  --line:rgba(58,30,18,.16); --danger:#9B3B2E; --ok:#3F6B4F;
  --r:14px; --hh:64px;
  --fh:'Amiri','Tajawal',serif; --fb:'Tajawal',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;color:var(--cream);
  background:radial-gradient(700px 480px at 85% 10%,rgba(192,139,92,.26),transparent 62%),radial-gradient(600px 420px at 5% 95%,rgba(192,139,92,.14),transparent 62%),var(--choc)}
.login-box{width:100%;max-width:380px;text-align:center}
.logo{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:block;object-fit:cover;background:var(--choc-2);
  box-shadow:0 0 0 2px rgba(227,197,165,.5),0 0 0 10px rgba(227,197,165,.08),0 22px 44px -14px rgba(0,0,0,.7)}
.login-box h1{margin:0 0 2px;font:700 2.2rem/1.2 var(--fh)}
.login-box .en{margin:0 0 4px;letter-spacing:.3em;color:var(--accent-2);font-size:.8rem;direction:ltr}
.login-box p.sub{margin:0 0 18px;color:var(--accent-2)}
.login-box label{text-align:start}
label{display:block;margin:14px 0 6px;font-weight:500;font-size:.95rem}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-height:48px}
textarea{resize:vertical;min-height:84px}
#login input{background:var(--choc-2);border-color:rgba(227,197,165,.35);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--choc);font-weight:700;background:var(--choc);color:var(--cream);transition:background .2s}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--choc)}.btn.gold:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--choc);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:rgba(155,59,46,.4)}
.btn.full{width:100%;margin-top:20px}
.btn[disabled]{opacity:.55;cursor:default}
.err{margin-top:14px;color:#F2B8A8;font-size:.95rem;min-height:1.4em}
.sheet .err{color:var(--danger)}

/* ---------- app ---------- */
header.top{position:sticky;top:0;z-index:6;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:var(--choc);color:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--choc-2);box-shadow:0 0 0 1.5px rgba(227,197,165,.55)}
header.top h1{margin:0;font:700 1.35rem/1.15 var(--fh)}
header.top small{display:block;color:var(--accent-2);font:400 .78rem var(--fb)}
header.top button{background:transparent;border:1.5px solid rgba(227,197,165,.4);color:var(--cream);border-radius:999px;min-height:40px;padding:0 16px}

.stick{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0;max-width:720px;margin:0 auto}
.sec{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font:700 1.05rem var(--fb);color:var(--choc)}
.sec[aria-pressed=true]{background:var(--choc);color:var(--cream);border-color:var(--choc);box-shadow:inset 0 -3px 0 var(--accent)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;max-width:720px;margin:0 auto}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);color:var(--choc);border-color:var(--accent);font-weight:700}
.tab span{opacity:.65;margin-inline-start:6px;font-size:.85rem}

main{max-width:720px;margin:0 auto;padding:16px 16px 170px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.row.is-hidden{opacity:.55}
.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--cream-2);flex:none}
.row-main{flex:1;min-width:0;text-align:start;background:none;border:0;padding:6px 0;display:block}
.row-main b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{color:var(--accent-deep);font:700 1.05rem var(--fh)}
.badge{display:inline-block;margin-inline-start:8px;padding:0 8px;border-radius:999px;background:var(--cream-2);color:var(--muted);font:400 .78rem var(--fb);font-style:normal}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:38px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);line-height:1}
.mv button[disabled]{opacity:.35;cursor:default}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.add{margin-top:14px;width:100%}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.foot .btn{min-height:40px;font-size:.9rem;font-weight:500;text-decoration:none}

/* publish bar */
#bar{position:fixed;inset-inline:0;bottom:0;z-index:7;background:var(--choc);color:var(--cream);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:2px solid var(--accent);box-shadow:0 -6px 20px rgba(42,22,13,.3)}
#bar p{margin:0;font-size:.95rem}
#bar .btns{display:flex;gap:8px}
#bar .btn{min-height:44px;padding:0 16px}
#bar .btn.light{background:var(--cream);color:var(--choc);border-color:var(--cream)}

/* edit sheet */
dialog{border:0;padding:0;background:var(--cream);color:var(--ink);width:100%;max-width:560px;max-height:94dvh;margin:auto auto 0;border-radius:22px 22px 0 0;overflow:auto}
dialog::backdrop{background:rgba(42,22,13,.6)}
@media(min-width:640px){dialog{margin:auto;border-radius:22px}}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font:700 1.45rem/1.3 var(--fh);color:var(--choc)}
.pic{display:flex;align-items:center;gap:14px;margin-top:8px}
.pic img{width:92px;height:92px;border-radius:14px;object-fit:cover;background:var(--cream-2)}
.pic small{display:block;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--choc)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.ltr{direction:ltr;text-align:left}

#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;margin:auto;max-width:420px;background:var(--choc-2);color:var(--cream);padding:12px 16px;border-radius:12px;text-align:center;border:1px solid var(--accent);box-shadow:0 8px 24px rgba(42,22,13,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--danger);border-color:var(--danger)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<!-- ================= Login ================= -->
<section id="login">
  <form class="login-box" id="loginForm" autocomplete="on">
    <img class="logo" src="assets/img/logo-512.png" alt="" width="104" height="104" onerror="this.style.visibility='hidden'">
    <h1>لوحة المنيو</h1>
    <div class="en">BOCCA DI CAFFÈ</div>
    <p class="sub">للإدارة فقط</p>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" name="email" type="email" class="ltr" autocomplete="username" required>
    <label for="pass">الرمز السري</label>
    <input id="pass" name="password" type="password" class="ltr" autocomplete="current-password" required>
    <button class="btn gold full" id="loginBtn" type="submit">دخول</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- ================= App ================= -->
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <img src="assets/img/logo-512.png" alt="" width="40" height="40" onerror="this.style.display='none'">
      <h1>لوحة المنيو<small id="stamp"></small></h1>
    </div>
    <button id="logout" type="button">خروج</button>
  </header>
  <div class="stick">
    <div class="secs" id="secs">
      <button class="sec" type="button" data-sec="cafe" aria-pressed="true">الكافيه</button>
      <button class="sec" type="button" data-sec="rest" aria-pressed="false">المطعم</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="الأقسام"></nav>
  </div>
  <main>
    <ul class="list" id="list"></ul>
    <button class="btn gold add" id="addBtn" type="button">+ إضافة صنف</button>
    <div class="foot">
      <button class="btn ghost" id="backup" type="button">تحميل نسخة احتياطية</button>
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">فتح الموقع</a>
    </div>
  </main>

  <div id="bar" hidden>
    <p id="barText">في تغييرات لم تُنشر بعد</p>
    <div class="btns">
      <button class="btn light" id="discard" type="button">تراجع</button>
      <button class="btn gold" id="publish" type="button">نشر التغييرات</button>
    </div>
  </div>
</div>

<!-- ================= Edit sheet ================= -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet">
    <h2 id="dlgTitle">صنف</h2>

    <div class="pic">
      <img id="f-img" alt="" width="92" height="92">
      <div>
        <button class="btn ghost" id="pickImg" type="button">اختيار صورة</button>
        <small id="imgNote">تُصغَّر الصورة تلقائياً قبل الرفع</small>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>

    <label for="f-name-ar">الاسم بالعربي</label>
    <input id="f-name-ar" type="text">
    <label for="f-name-en">الاسم بالإنجليزي</label>
    <input id="f-name-en" type="text" class="ltr">
    <div class="two">
      <div>
        <label for="f-price">السعر بالريال</label>
        <input id="f-price" type="text" inputmode="decimal" class="ltr" placeholder="مثال: 23.5">
      </div>
      <div id="calWrap">
        <label for="f-cal">السعرات (اختياري)</label>
        <input id="f-cal" type="text" inputmode="numeric" class="ltr" placeholder="مثال: 450">
      </div>
    </div>
    <label for="f-desc">الوصف بالعربي (اختياري)</label>
    <textarea id="f-desc"></textarea>

    <label class="check"><input id="f-hidden" type="checkbox"> إخفاء الصنف مؤقتاً (نفد)</label>

    <div class="err" id="dlgErr" role="alert"></div>
    <div class="actions">
      <button class="btn gold" id="saveItem" type="button">حفظ</button>
      <button class="btn ghost" id="closeItem" type="button">إلغاء</button>
    </div>
    <div class="actions" id="delWrap"><button class="btn danger" id="delItem" type="button">حذف الصنف</button></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/menu-data.js"></script>
<script src="assets/supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.BOCCA_SUPABASE || {};
  var configured = !!(C.url && C.anonKey && !/YOUR_/.test(C.url + C.anonKey));
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var SKEY = 'bocca_admin_session';
  var session = null, menu = { cafe: [], rest: [] }, publishedJson = '', publishedAt = '';
  var sec = 'cafe', activeCat = { cafe: null, rest: null };
  var edit = null;           // { idx: number|null, image: string, uploading: bool }

  /* ---------- small helpers ---------- */
  var toastTimer;
  function toast(msg, bad) {
    var t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, 3400);
  }
  function normNum(s) {
    return String(s || '').replace(/[\u0660-\u0669]/g, function (d) { return d.charCodeAt(0) - 0x660; })
      .replace(/[\u06F0-\u06F9]/g, function (d) { return d.charCodeAt(0) - 0x6F0; })
      .replace(/[\u066B\u060C,]/g, '.').replace(/\s+/g, '').trim();
  }
  function fmtPrice(p) { return (p == null || isNaN(p)) ? 'بدون سعر' : (Math.round(p * 100) / 100) + ' ر.س'; }
  function isDirty() { return JSON.stringify(menu) !== publishedJson; }

  /* ---------- auth (Supabase GoTrue over fetch) ---------- */
  function saveSession(s) {
    session = s;
    try { s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); } catch (e) {}
  }
  function toSession(j) {
    return { access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)) };
  }
  function authFetch(grant, body) {
    return fetch(C.url + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST', headers: { apikey: C.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
  }
  function refreshSession() {
    return authFetch('refresh_token', { refresh_token: session.refresh_token }).then(function (r) {
      if (!r.ok) throw new Error('expired');
      return r.json();
    }).then(function (j) { saveSession(toSession(j)); });
  }
  function token() {
    if (!session) return Promise.reject(new Error('no session'));
    if (session.expires_at * 1000 - Date.now() > 60000) return Promise.resolve(session.access_token);
    return refreshSession().then(function () { return session.access_token; });
  }
  function api(path, opts) {
    return token().then(function (tk) {
      opts = opts || {};
      var h = opts.headers || {};
      h.apikey = C.anonKey; h.Authorization = 'Bearer ' + tk;
      opts.headers = h;
      return fetch(C.url + path, opts);
    });
  }

  /* ---------- screens ---------- */
  function showLogin(msg) {
    $('#app').hidden = true; $('#login').hidden = false;
    $('#loginErr').textContent = msg || '';
    $('#pass').value = '';
  }
  function showApp() {
    $('#login').hidden = true; $('#app').hidden = false;
    loadMenu();
  }

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!configured) { $('#loginErr').textContent = 'لم يتم ربط Supabase بعد. عبّي ملف assets/supabase-config.js'; return; }
    var btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
    authFetch('password', { email: $('#email').value.trim(), password: $('#pass').value })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.access_token) throw new Error('bad');
        saveSession(toSession(res.j)); showApp();
      })
      .catch(function () { $('#loginErr').textContent = 'البريد أو الرمز غير صحيح، أو لا يوجد اتصال.'; })
      .then(function () { btn.disabled = false; });
  });

  $('#logout').addEventListener('click', function () {
    if (isDirty() && !confirm('في تغييرات لم تُنشر. تخرج وتلغيها؟')) return;
    saveSession(null); menu = { cafe: [], rest: [] }; publishedJson = ''; showLogin();
  });

  /* ---------- load / publish ---------- */
  function validMenu(m) {
    return !!m && Array.isArray(m.cafe) && Array.isArray(m.rest) && m.cafe.length + m.rest.length > 0 &&
      [].concat(m.cafe, m.rest).every(function (c) { return c && c.id && Array.isArray(c.items); });
  }
  function loadMenu() {
    $('#list').innerHTML = '<li class="empty">جاري التحميل…</li>';
    fetch(C.url + '/rest/v1/site_data?key=eq.menu&select=value,updated_at', {
      headers: { apikey: C.anonKey, Authorization: 'Bearer ' + C.anonKey }, cache: 'no-store'
    }).then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); })
      .then(function (rows) {
        if (rows && rows[0] && validMenu(rows[0].value)) { menu = clone(rows[0].value); publishedAt = rows[0].updated_at; }
        else { menu = clone(window.BOCCA_MENU); publishedAt = ''; }        // first time: start from menu-data.js
        publishedJson = JSON.stringify(menu);
        ['cafe', 'rest'].forEach(function (k) {
          if (!menu[k].some(function (c) { return c.id === activeCat[k]; })) activeCat[k] = menu[k][0] ? menu[k][0].id : null;
        });
        render();
      })
      .catch(function () {
        $('#list').innerHTML = '<li class="empty">تعذّر تحميل المنيو. تأكد من الاتصال وأعد فتح الصفحة.</li>';
      });
  }

  function publish() {
    var btn = $('#publish'); btn.disabled = true; btn.textContent = 'جاري النشر…';
    var now = new Date().toISOString();
    api('/rest/v1/site_data?on_conflict=key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ key: 'menu', value: menu, updated_at: now })
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) { saveSession(null); showLogin('انتهت الجلسة. سجّل الدخول مرة ثانية. تغييراتك ما زالت محفوظة هنا.'); throw new Error('auth'); }
      if (!r.ok) throw new Error('save');
      publishedJson = JSON.stringify(menu); publishedAt = now;
      render(); toast('تم النشر. يظهر في الموقع خلال ثوانٍ.');
    }).catch(function (e) {
      if (e && e.message !== 'auth') toast('فشل النشر. تأكد من الاتصال وحاول مرة ثانية.', true);
    }).then(function () { btn.disabled = false; btn.textContent = 'نشر التغييرات'; });
  }
  $('#publish').addEventListener('click', publish);
  $('#discard').addEventListener('click', function () {
    if (!confirm('تلغي كل التغييرات غير المنشورة؟')) return;
    menu = JSON.parse(publishedJson); render();
  });
  window.addEventListener('beforeunload', function (e) { if (!$('#app').hidden && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- render ---------- */
  function cat() { return menu[sec].filter(function (c) { return c.id === activeCat[sec]; })[0]; }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.sec'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-sec') === sec); });
    $('#tabs').innerHTML = menu[sec].map(function (c) {
      return '<button class="tab" role="tab" data-cat="' + esc(c.id) + '" aria-selected="' + (c.id === activeCat[sec]) + '">' +
        esc(c.ar) + '<span>' + c.items.length + '</span></button>';
    }).join('');

    var c = cat(), items = c ? c.items : [];
    $('#addBtn').hidden = !c;
    $('#list').innerHTML = items.length ? items.map(function (it, i) {
      return '<li class="row' + (it.hidden ? ' is-hidden' : '') + '" data-i="' + i + '">' +
        '<img class="thumb" src="' + esc(it.img || '') + '" alt="" loading="lazy">' +
        '<button class="row-main" type="button" data-act="edit"><b>' + esc(it.ar) +
        (it.hidden ? '<em class="badge">مخفي</em>' : '') + '</b><span>' + esc(fmtPrice(it.price)) + '</span></button>' +
        '<div class="mv"><button type="button" data-act="up" aria-label="تحريك لفوق"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
        '<button type="button" data-act="down" aria-label="تحريك لتحت"' + (i === items.length - 1 ? ' disabled' : '') + '>▼</button></div></li>';
    }).join('') : '<li class="empty">القسم فاضي. أضف أول صنف.</li>';

    $('#stamp').textContent = publishedAt ? 'آخر نشر: ' + new Date(publishedAt).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' }) : 'لم يُنشر شيء بعد';
    $('#bar').hidden = !isDirty();
  }

  $('#list').addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'IMG') e.target.style.visibility = 'hidden';
  }, true);

  $('#secs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sec]'); if (!b) return;
    sec = b.getAttribute('data-sec'); render(); window.scrollTo({ top: 0 });
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b) return;
    activeCat[sec] = b.getAttribute('data-cat'); render();
    window.scrollTo({ top: 0 });
  });

  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var i = +b.closest('.row').getAttribute('data-i'), items = cat().items, act = b.getAttribute('data-act');
    if (act === 'edit') openSheet(i);
    else if (act === 'up' && i > 0) { items.splice(i - 1, 0, items.splice(i, 1)[0]); render(); }
    else if (act === 'down' && i < items.length - 1) { items.splice(i + 1, 0, items.splice(i, 1)[0]); render(); }
  });
  $('#addBtn').addEventListener('click', function () { openSheet(null); });

  /* ---------- edit sheet ---------- */
  var dlg = $('#dlg');
  function openSheet(idx) {
    var it = idx == null ? {} : cat().items[idx];
    edit = { idx: idx, image: it.img || '', uploading: false };
    $('#dlgTitle').textContent = idx == null ? 'صنف جديد في ' + cat().ar : 'تعديل الصنف';
    $('#f-name-ar').value = it.ar || ''; $('#f-name-en').value = it.en || '';
    $('#f-desc').value = it.desc || '';
    $('#f-price').value = it.price == null ? '' : it.price;
    $('#f-cal').value = it.cal == null ? '' : it.cal;
    $('#calWrap').hidden = sec !== 'rest';
    $('#f-hidden').checked = !!it.hidden;
    setPreview(edit.image);
    $('#dlgErr').textContent = ''; $('#imgNote').textContent = 'تُصغَّر الصورة تلقائياً قبل الرفع';
    $('#delWrap').hidden = idx == null; $('#saveItem').disabled = false;
    dlg.showModal();
  }
  function setPreview(src) {
    var im = $('#f-img'); im.style.visibility = src ? 'visible' : 'hidden'; im.src = src || '';
  }
  $('#closeItem').addEventListener('click', function () { dlg.close(); });

  $('#saveItem').addEventListener('click', function () {
    var err = $('#dlgErr'); err.textContent = '';
    if (edit.uploading) { err.textContent = 'انتظر حتى تنتهي رفع الصورة.'; return; }
    var nameAr = $('#f-name-ar').value.trim();
    if (!nameAr) { err.textContent = 'اكتب اسم الصنف بالعربي.'; return; }
    var raw = normNum($('#f-price').value), price = Number(raw);
    if (raw === '' || !isFinite(price) || price < 0) { err.textContent = 'اكتب السعر كرقم، مثل 23.5'; return; }
    var calRaw = normNum($('#f-cal').value), cal = null;
    if (sec === 'rest' && calRaw !== '') { cal = Number(calRaw); if (!isFinite(cal) || cal < 0) { err.textContent = 'السعرات لازم تكون رقم.'; return; } }

    var c = cat(), isNew = edit.idx == null, it = isNew ? {} : c.items[edit.idx];
    it.ar = nameAr;
    var en = $('#f-name-en').value.trim(); if (en) it.en = en; else delete it.en;
    var d = $('#f-desc').value.trim(); if (d) it.desc = d; else delete it.desc;
    it.price = price;
    if (cal != null) it.cal = cal; else if (sec === 'rest') delete it.cal;
    if (edit.image) it.img = edit.image; else delete it.img;
    if ($('#f-hidden').checked) it.hidden = true; else delete it.hidden;
    if (isNew) c.items.push(it);
    dlg.close(); render();
    toast(isNew ? 'تمت الإضافة. اضغط «نشر التغييرات» ليظهر في الموقع.' : 'تم الحفظ. اضغط «نشر التغييرات» ليظهر في الموقع.');
  });

  $('#delItem').addEventListener('click', function () {
    var c = cat(), it = c.items[edit.idx];
    if (!confirm('تحذف «' + it.ar + '» من المنيو؟')) return;
    c.items.splice(edit.idx, 1); dlg.close(); render();
    toast('تم الحذف. اضغط «نشر التغييرات» ليختفي من الموقع.');
  });

  /* ---------- image upload (resize in the browser, then Storage) ---------- */
  function loadImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); res(im); };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      im.src = url;
    });
  }
  function toBlob(cv, type, q) { return new Promise(function (res) { cv.toBlob(res, type, q); }); }
  function shrink(file) {
    return loadImage(file).then(function (im) {
      var MAX = 1000, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, MAX / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      return toBlob(cv, 'image/webp', 0.82).then(function (b) {
        return (b && b.type === 'image/webp') ? b : toBlob(cv, 'image/jpeg', 0.85);
      });
    });
  }
  $('#pickImg').addEventListener('click', function () { $('#file').click(); });
  $('#file').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    var my = edit, note = $('#imgNote'), save = $('#saveItem'); $('#dlgErr').textContent = '';
    my.uploading = true; save.disabled = true; note.textContent = 'جاري رفع الصورة…';
    shrink(f).then(function (blob) {
      var ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
      var base = sec + '-' + String(activeCat[sec]).replace(/[^a-z0-9_-]/gi, '') + '-' + Date.now() + '.' + ext;
      return api('/storage/v1/object/menu-images/' + base, { method: 'POST', headers: { 'Content-Type': blob.type, 'x-upsert': 'false' }, body: blob })
        .then(function (r) { if (!r.ok) throw new Error('upload'); return C.url + '/storage/v1/object/public/menu-images/' + base; });
    }).then(function (url) {
      my.image = url; if (edit === my) { setPreview(url); note.textContent = 'تم رفع الصورة. اضغط حفظ.'; }
    }).catch(function () {
      note.textContent = 'تعذّر رفع الصورة. جرّب صورة ثانية.'; $('#dlgErr').textContent = 'فشل رفع الصورة.';
    }).then(function () { my.uploading = false; if (edit === my) save.disabled = false; });
  });

  /* ---------- backup ---------- */
  $('#backup').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(menu, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'bocca-menu-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- start ---------- */
  try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; }
  if (!configured) showLogin('لم يتم ربط Supabase بعد. عبّي ملف assets/supabase-config.js');
  else if (session && session.refresh_token) {
    token().then(showApp).catch(function () { saveSession(null); showLogin(); });
  } else showLogin();
})();
</script>
</body>
</html>
